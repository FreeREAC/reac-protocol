name: ksy-conformance
on:
  push:
    paths: ['spec/**', '.github/workflows/ksy-conformance.yml']
  pull_request:
    paths: ['spec/**', '.github/workflows/ksy-conformance.yml']
jobs:
  ksy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install ksc
        run: |
          curl -fsSLO https://github.com/kaitai-io/kaitai_struct_compiler/releases/download/0.11/kaitai-struct-compiler-0.11.zip
          unzip -q kaitai-struct-compiler-0.11.zip
          echo "$PWD/kaitai-struct-compiler-0.11/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the Kaitai Python runtime + pytest
        run: pip install kaitaistruct pytest
      - name: Regenerate the parser from the spec and cross-check the fixtures
        run: make -C spec check
      - name: Verify the cpp_stl (C-family) target also generates
        run: make -C spec cpp
